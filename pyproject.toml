[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "entsoe-observatory"
version = "0.1.0"
description = "Reproducible low-cost data platform for ENTSO-E day-ahead prices and actual load"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.5,<2",
  "httpx>=0.28,<1",
  "pyarrow>=21,<27",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pytz>=2024.1",
  "tzdata>=2024.1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
spark = ["pyspark==3.5.5", "pandas>=2.2,<4"]
publish = ["boto3>=1.35,<2", "huggingface-hub>=0.30,<2"]
dev = [
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "psutil>=6,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-pytz",
]

[project.scripts]
entsoe-observatory = "entsoe_observatory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/entsoe_observatory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings -m 'not integration and not spark'"
markers = [
  "integration: needs the local raw XML snapshot and the old parquet snapshot",
  "spark: needs a working local Spark (skipped when unavailable)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "pyspark.*", "duckdb.*", "boto3.*", "huggingface_hub.*"]
ignore_missing_imports = true
